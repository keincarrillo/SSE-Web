<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dff0ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8ec4e8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#4a90c4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Diente principal -->
  <g filter="url(#shadow)">
    <!-- Cuerpo del diente -->
    <path d="
      M 28 20
      C 20 20, 14 28, 14 38
      C 14 46, 18 52, 22 56
      C 24 58, 24 62, 25 68
      C 26 76, 28 86, 32 88
      C 35 90, 38 86, 40 80
      C 42 74, 43 70, 46 68
      C 47 67, 50 67, 54 68
      C 57 70, 58 74, 60 80
      C 62 86, 65 90, 68 88
      C 72 86, 74 76, 75 68
      C 76 62, 76 58, 78 56
      C 82 52, 86 46, 86 38
      C 86 28, 80 20, 72 20
      C 66 20, 62 24, 58 26
      C 55 28, 52 28, 50 28
      C 48 28, 45 28, 42 26
      C 38 24, 34 20, 28 20
      Z
    " fill="url(#toothGrad)" stroke="#a8cce0" stroke-width="2"/>

    <!-- Zona de raíces (más oscura) -->
    <path d="
      M 32 72
      C 32 72, 32 82, 34 87
      C 35.5 90, 38 87, 40 80
      C 42 74, 43 70, 46 68
      C 47 67, 50 67, 54 68
      C 57 70, 58 74, 60 80
      C 62 87, 64.5 90, 66 87
      C 68 82, 68 72, 68 72
      Z
    " fill="url(#shadowGrad)" opacity="0.5"/>

    <!-- Brillo superior izquierdo -->
    <path d="
      M 22 28
      C 20 32, 18 38, 20 44
      C 21 46, 23 46, 24 44
      C 26 38, 26 30, 28 26
      C 29 24, 27 24, 25 25
      C 23 26, 22 27, 22 28
      Z
    " fill="white" opacity="0.7"/>

    <!-- Brillo pequeño -->
    <ellipse cx="35" cy="30" rx="4" ry="6" fill="white" opacity="0.5" transform="rotate(-15, 35, 30)"/>

    <!-- Línea divisoria corona/raíz (surco gingival) -->
    <path d="M 24 58 Q 50 62 76 58" fill="none" stroke="#a8cce0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  </g>
</svg>
